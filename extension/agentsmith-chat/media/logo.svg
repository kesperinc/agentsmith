<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <!-- Bright Edge Neon Gradients -->
    <linearGradient id="airGradCyan" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#00b0ff" />
      <stop offset="40%" stop-color="#00e5ff" />
      <stop offset="80%" stop-color="#80d8ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="airGradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ea80fc" />
      <stop offset="70%" stop-color="#b388ff" />
      <stop offset="100%" stop-color="#7c4dff" />
    </linearGradient>

    <linearGradient id="airGradSky" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#7c4dff" />
      <stop offset="40%" stop-color="#00e5ff" />
      <stop offset="80%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="coreGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#b388ff" />
    </linearGradient>

    <!-- Neon Rim Light Filter -->
    <filter id="neonEdgeFilter" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Trinity Air: Background Subtle Glow Aura -->
  <g filter="url(#neonEdgeFilter)" opacity="0.6">
    <path d="M128 22 C178 22 236 84 218 160 C206 208 152 234 104 226 C56 218 20 172 26 122 C32 76 78 30 128 22 Z" 
          stroke="#00e5ff" stroke-width="6" fill="none" />
  </g>

  <!-- Blade 1: Left-to-Top Aerodynamic Air Flow (Cyan/White Edge) -->
  <path d="M48 184 C28 136 44 68 128 28 C144 58 152 94 136 126 C124 150 96 172 48 184 Z" 
        fill="#00e5ff" fill-opacity="0.12"
        stroke="url(#airGradCyan)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#neonEdgeFilter)" />

  <!-- Blade 2: Top-to-Right Aerodynamic Air Flow (Purple/Magenta Edge) -->
  <path d="M128 28 C188 44 234 106 208 184 C176 174 144 154 130 126 C118 100 120 62 128 28 Z" 
        fill="#b388ff" fill-opacity="0.12"
        stroke="url(#airGradPurple)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#neonEdgeFilter)" />

  <!-- Blade 3: Right-to-Left Aerodynamic Bottom Flow (Sky/Electric Cyan Edge) -->
  <path d="M208 184 C164 232 92 232 48 184 C76 164 112 152 144 158 C172 164 194 176 208 184 Z" 
        fill="#00b0ff" fill-opacity="0.12"
        stroke="url(#airGradSky)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#neonEdgeFilter)" />

  <!-- Inner Möbius Dynamic Curve Ribbons -->
  <path d="M128 32 Q148 92 118 140 Q88 188 48 184" 
        stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" />
  
  <path d="M208 184 Q148 172 118 140 Q88 108 128 32" 
        stroke="#80d8ff" stroke-width="6" stroke-linecap="round" fill="none" />

  <path d="M48 184 Q112 216 168 188 Q204 170 208 184" 
        stroke="#ea80fc" stroke-width="6" stroke-linecap="round" fill="none" />

  <!-- Trinity Air Central Quantum Vortex (Air Core) -->
  <circle cx="128" cy="142" r="14" fill="#0b0d14" stroke="url(#coreGlowGrad)" stroke-width="7" />
  <circle cx="128" cy="142" r="5" fill="#ffffff" filter="url(#neonEdgeFilter)" />

  <!-- 3 Apex Energy Pulsar Nodes -->
  <circle cx="128" cy="28" r="7" fill="#ffffff" filter="url(#neonEdgeFilter)" />
  <circle cx="128" cy="28" r="3" fill="#00e5ff" />

  <circle cx="48" cy="184" r="7" fill="#00e5ff" filter="url(#neonEdgeFilter)" />
  <circle cx="48" cy="184" r="3" fill="#ffffff" />

  <circle cx="208" cy="184" r="7" fill="#b388ff" filter="url(#neonEdgeFilter)" />
  <circle cx="208" cy="184" r="3" fill="#ffffff" />
</svg>