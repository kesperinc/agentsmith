<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <!-- Bright Edge Neon Gradients -->
    <linearGradient id="edgeGradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00b0ff" />
    </linearGradient>

    <linearGradient id="edgeGradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#d1c4e9" />
      <stop offset="100%" stop-color="#b388ff" />
    </linearGradient>

    <linearGradient id="edgeGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#80d8ff" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Outer Cybernetic Hexagon Shield (Bright Edge) -->
  <polygon points="128,16 232,74 232,182 128,240 24,182 24,74" 
           stroke="url(#edgeGradCyan)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- 2. Inner Isometric Neural Cube Edges -->
  <!-- Top Face Edges -->
  <polygon points="128,34 212,82 128,130 44,82" 
           stroke="url(#edgeGradWhite)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
  
  <!-- Left Face Edge -->
  <polyline points="44,82 44,170 128,218" 
            stroke="url(#edgeGradCyan)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Right Face Edge -->
  <polyline points="212,82 212,170 128,218" 
            stroke="url(#edgeGradPurple)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Center Y-Axis Spindle -->
  <line x1="128" y1="130" x2="128" y2="218" 
        stroke="url(#edgeGradWhite)" stroke-width="8" stroke-linecap="round" />

  <!-- 3. Agent Smith Signature Cyber Shades (Matrix Glasses Edge Line) -->
  <!-- Left Lens Frame -->
  <polygon points="68,116 114,116 106,146 76,146" 
           fill="#00e5ff" fill-opacity="0.25" stroke="#ffffff" stroke-width="9" stroke-linejoin="round" />

  <!-- Right Lens Frame -->
  <polygon points="142,116 188,116 180,146 150,146" 
           fill="#00e5ff" fill-opacity="0.25" stroke="#ffffff" stroke-width="9" stroke-linejoin="round" />

  <!-- Sunglasses Bridge -->
  <line x1="114" y1="120" x2="142" y2="120" 
        stroke="#ffffff" stroke-width="9" stroke-linecap="round" />

  <!-- 4. Quantum AI Core Nodes (Glowing Dots & Accent Lines) -->
  <circle cx="128" cy="74" r="9" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="86" cy="180" r="7" fill="#00e5ff" />
  <circle cx="170" cy="180" r="7" fill="#b388ff" />

  <!-- Accent Circuit Paths -->
  <line x1="128" y1="74" x2="128" y2="108" stroke="#ffffff" stroke-width="5" stroke-dasharray="4 3" stroke-linecap="round" />
  <line x1="86" y1="180" x2="128" y2="160" stroke="#00e5ff" stroke-width="5" stroke-linecap="round" />
  <line x1="170" y1="180" x2="128" y2="160" stroke="#b388ff" stroke-width="5" stroke-linecap="round" />
</svg>
